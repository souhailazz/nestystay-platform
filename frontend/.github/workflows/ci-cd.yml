name: NestyStay frontend CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.example.com/api' }}
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.VITE_STRIPE_PUBLIC_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

  publish-and-deploy:
    name: Build and deploy static bundle to nginx host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
          VITE_STRIPE_PUBLIC_KEY: ${{ vars.VITE_STRIPE_PUBLIC_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Archive release
        run: tar -czf nestystay-frontend-${{ github.sha }}.tar.gz -C dist .

      - name: Copy release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: nestystay-frontend-${{ github.sha }}.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Switch frontend release and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ARCHIVE: nestystay-frontend-${{ github.sha }}.tar.gz
          HEALTHCHECK_URL: ${{ secrets.FRONTEND_HEALTHCHECK_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ARCHIVE,HEALTHCHECK_URL
          script_stop: true
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            test -f "$DEPLOY_PATH/$RELEASE_ARCHIVE"
            RELEASE_DIR="$DEPLOY_PATH/releases/$GITHUB_SHA"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$DEPLOY_PATH/$RELEASE_ARCHIVE" -C "$RELEASE_DIR"
            ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            if [ -n "${HEALTHCHECK_URL:-}" ]; then
              curl --fail --silent --show-error --retry 12 --retry-delay 5 "$HEALTHCHECK_URL/"
            fi
