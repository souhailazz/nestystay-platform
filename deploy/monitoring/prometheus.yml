global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  # The API health endpoints are monitored by Uptime Kuma.  When an
  # application metrics endpoint is enabled, add it here as nestystay-api.
  # Keeping this target explicit avoids treating JSON health responses as
  # Prometheus exposition data.
