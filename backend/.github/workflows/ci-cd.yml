name: NestyStay backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Restore, build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NestyStay.sln

      - name: Build
        run: dotnet build NestyStay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NestyStay.sln --configuration Release --no-build --logger "console;verbosity=minimal"

  publish-and-deploy:
    name: Publish and deploy to systemd host
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NestyStay.sln

      - name: Publish release
        run: dotnet publish src/NestyStay.Api/NestyStay.Api.csproj --configuration Release --no-restore --output publish

      - name: Publish migration-check tool
        run: dotnet publish tools/NestyStay.MigrationCheck/NestyStay.MigrationCheck.csproj --configuration Release --no-restore --output migration-check

      - name: Archive release
        run: tar -czf nestystay-backend-${{ github.sha }}.tar.gz -C publish .

      - name: Archive migration-check tool
        run: tar -czf nestystay-migration-check-${{ github.sha }}.tar.gz -C migration-check .

      - name: Copy release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: nestystay-backend-${{ github.sha }}.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Copy migration-check archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: nestystay-migration-check-${{ github.sha }}.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Switch backend release and restart systemd
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ARCHIVE: nestystay-backend-${{ github.sha }}.tar.gz
          MIGRATION_CHECK_ARCHIVE: nestystay-migration-check-${{ github.sha }}.tar.gz
          SYSTEMD_SERVICE: ${{ vars.BACKEND_SYSTEMD_SERVICE || 'nestystay-api.service' }}
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ARCHIVE,MIGRATION_CHECK_ARCHIVE,SYSTEMD_SERVICE,HEALTHCHECK_URL,GITHUB_SHA
          script_stop: true
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            test -f "$DEPLOY_PATH/$RELEASE_ARCHIVE"
            test -f "$DEPLOY_PATH/$MIGRATION_CHECK_ARCHIVE"

            # Apply reviewed EF Core migrations before activating the release.
            # This updates schema incrementally and never drops or resets data.
            CHECK_DIR="$DEPLOY_PATH/migration-check/$GITHUB_SHA"
            mkdir -p "$CHECK_DIR"
            tar -xzf "$DEPLOY_PATH/$MIGRATION_CHECK_ARCHIVE" -C "$CHECK_DIR"

            CONN_STR=$(grep -m1 '^ConnectionStrings__Postgres=' "$DEPLOY_PATH/.env" | cut -d'=' -f2-)
            test -n "$CONN_STR"

            DOTNET_BIN="$(command -v dotnet || true)"
            if [ -z "$DOTNET_BIN" ] && [ -x /home/admin/dotnet10/dotnet ]; then
              DOTNET_BIN=/home/admin/dotnet10/dotnet
            fi
            test -n "$DOTNET_BIN"

            ConnectionStrings__Postgres="$CONN_STR" "$DOTNET_BIN" "$CHECK_DIR/NestyStay.MigrationCheck.dll" --apply

            RELEASE_DIR="$DEPLOY_PATH/releases/$GITHUB_SHA"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$DEPLOY_PATH/$RELEASE_ARCHIVE" -C "$RELEASE_DIR"
            ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"
            sudo -n systemctl restart "$SYSTEMD_SERVICE"
            sudo -n systemctl is-active --quiet "$SYSTEMD_SERVICE"
            if [ -n "${HEALTHCHECK_URL:-}" ]; then
              curl --fail --silent --show-error --retry 12 --retry-delay 5 "$HEALTHCHECK_URL/api/health/ready"
            fi

  deploy-staging:
    name: Publish and deploy to staging host
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NestyStay.sln

      - name: Publish release
        run: dotnet publish src/NestyStay.Api/NestyStay.Api.csproj --configuration Release --no-restore --output publish

      - name: Publish migration-check tool
        run: dotnet publish tools/NestyStay.MigrationCheck/NestyStay.MigrationCheck.csproj --configuration Release --no-restore --output migration-check

      - name: Archive release
        run: tar -czf nestystay-backend-${{ github.sha }}.tar.gz -C publish .

      - name: Archive migration-check tool
        run: tar -czf nestystay-migration-check-${{ github.sha }}.tar.gz -C migration-check .

      - name: Copy release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: nestystay-backend-${{ github.sha }}.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Copy migration-check archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: nestystay-migration-check-${{ github.sha }}.tar.gz
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Switch backend release and restart systemd
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ARCHIVE: nestystay-backend-${{ github.sha }}.tar.gz
          MIGRATION_CHECK_ARCHIVE: nestystay-migration-check-${{ github.sha }}.tar.gz
          SYSTEMD_SERVICE: ${{ vars.BACKEND_SYSTEMD_SERVICE || 'nestystay-api.service' }}
          HEALTHCHECK_HOST: ${{ vars.BACKEND_HEALTHCHECK_HOST || 'staging.nestystay.net' }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,RELEASE_ARCHIVE,MIGRATION_CHECK_ARCHIVE,SYSTEMD_SERVICE,HEALTHCHECK_HOST,GITHUB_SHA
          script_stop: true
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            if ! printf "%s" "$HEALTHCHECK_HOST" | grep -Eq "^[A-Za-z0-9][A-Za-z0-9.-]*$"; then
              echo "Invalid staging health-check host" >&2
              exit 1
            fi
            test -f "$DEPLOY_PATH/$RELEASE_ARCHIVE"
            test -f "$DEPLOY_PATH/$MIGRATION_CHECK_ARCHIVE"

            # Apply reviewed EF Core migrations before activating the release.
            # This updates schema incrementally and never drops or resets data.
            CHECK_DIR="$DEPLOY_PATH/migration-check/$GITHUB_SHA"
            mkdir -p "$CHECK_DIR"
            tar -xzf "$DEPLOY_PATH/$MIGRATION_CHECK_ARCHIVE" -C "$CHECK_DIR"

            CONN_STR=$(grep -m1 '^ConnectionStrings__Postgres=' "$DEPLOY_PATH/.env" | cut -d'=' -f2-)
            test -n "$CONN_STR"

            DOTNET_BIN="$(command -v dotnet || true)"
            if [ -z "$DOTNET_BIN" ] && [ -x /home/admin/dotnet10/dotnet ]; then
              DOTNET_BIN=/home/admin/dotnet10/dotnet
            fi
            test -n "$DOTNET_BIN"

            ConnectionStrings__Postgres="$CONN_STR" "$DOTNET_BIN" "$CHECK_DIR/NestyStay.MigrationCheck.dll" --apply

            RELEASE_DIR="$DEPLOY_PATH/releases/$GITHUB_SHA"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$DEPLOY_PATH/$RELEASE_ARCHIVE" -C "$RELEASE_DIR"
            ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"
            sudo -n systemctl restart "$SYSTEMD_SERVICE"
            sudo -n systemctl is-active --quiet "$SYSTEMD_SERVICE"
            for check in live ready; do
              echo "Checking origin /api/health/$check through local nginx"
              curl --fail --silent --show-error --location --retry 12 --retry-delay 5 \
                --resolve "$HEALTHCHECK_HOST:443:127.0.0.1" \
                "https://$HEALTHCHECK_HOST/api/health/$check"
            done

      - name: Verify public staging health from GitHub runner
        env:
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          base="${HEALTHCHECK_URL%/}"
          test -n "$base"

          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$headers_file" "$body_file"' EXIT
          status="$(curl --silent --show-error --location --retry 2 --retry-delay 5 \
            --dump-header "$headers_file" --output "$body_file" --write-out '%{http_code}' \
            "$base/api/health/ready")"

          echo "Public /api/health/ready returned HTTP $status"
          grep -Ei '^(HTTP/|server:|cf-ray:|cf-cache-status:|content-type:|x-request-id:)' "$headers_file" || true
          if [ "$status" = "200" ]; then
            cat "$body_file"
          elif [ "$status" = "403" ] \
            && grep -qi '^server:[[:space:]]*cloudflare' "$headers_file" \
            && grep -qi 'Just a moment' "$body_file"; then
            echo "::warning::Cloudflare challenged the GitHub runner; origin health passed through local nginx. Public edge check needs verification from an allowed client network."
          else
            head -c 512 "$body_file" || true
            exit 1
          fi
