name: NestyStay backend CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR repository names must be lowercase even though the GitHub owner is not.
  IMAGE_NAME: ghcr.io/nestystayjamaica/nesty-stay-backend

jobs:
  verify:
    name: Restore, build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NestyStay.sln

      - name: Build
        run: dotnet build NestyStay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NestyStay.sln --configuration Release --no-build --logger "console;verbosity=minimal"

  publish-and-deploy:
    name: Publish image and deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Copy deployment compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: deploy/docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy backend container
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.BACKEND_HEALTHCHECK_URL }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,DEPLOY_IMAGE,GHCR_USERNAME,GHCR_TOKEN,HEALTHCHECK_URL
          script_stop: true
          script: |
            set -eu
            test -n "$DEPLOY_PATH"
            test -f "$DEPLOY_PATH/docker-compose.yml"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            cd "$DEPLOY_PATH"
            BACKEND_IMAGE="$DEPLOY_IMAGE" docker compose pull backend
            BACKEND_IMAGE="$DEPLOY_IMAGE" docker compose up -d --no-deps backend
            docker image prune -f --filter "until=168h"
            if [ -n "${HEALTHCHECK_URL:-}" ]; then
              curl --fail --silent --show-error --retry 12 --retry-delay 5 "$HEALTHCHECK_URL/api/health/ready"
            fi
